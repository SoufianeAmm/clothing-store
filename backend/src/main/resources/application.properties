spring.application.name=backend

# H2 file-based database stored under backend/data/ so content survives restarts
spring.datasource.url=jdbc:h2:file:./data/clothingstore;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto create/update tables from JPA entities - fine for a local dev/portfolio project
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at http://localhost:8080/h2-console (JDBC URL above, user sa, blank password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Allow the Vite dev server to call this API
app.cors.allowed-origin=http://localhost:5173
